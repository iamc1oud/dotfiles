theme = "ayu_dark"


[editor.auto-save]
auto-save = { focus-lost = true, after-delay.enable = true, after-delay.timeout = 2000 }

[editor.auto-save.after-delay]
enable = true
timeout = 3000

# macOS-style selection in normal mode
[keys.normal]
"Meta-S-left" = "extend_to_line_start"
"Meta-S-right" = "extend_to_line_end"
"A-S-left" = "extend_prev_word_start"
"A-S-right" = "extend_next_word_end"
"S-left" = "extend_char_left"
"S-right" = "extend_char_right"
"S-up" = "extend_visual_line_up"
"S-down" = "extend_visual_line_down"
# Cmd+Arrow: Ghostty sends Ctrl-A / Ctrl-E (overrides increment / scroll_down)
"C-a" = "goto_line_start"
"C-e" = "goto_line_end"
"Meta-left" = "goto_line_start"
"Meta-right" = "goto_line_end"
# Option+Arrow: word by word, no selection left behind
"A-left" = ["move_prev_word_start", "collapse_selection"]
"A-right" = ["move_next_word_end", "collapse_selection"]

[keys.insert]
"C-a" = "goto_line_start"
"C-e" = "goto_line_end_newline"
"Meta-left" = "goto_line_start"
"Meta-right" = "goto_line_end_newline"
"A-left" = ["move_prev_word_start", "collapse_selection"]
"A-right" = ["move_next_word_end", "collapse_selection", "move_char_right"]
